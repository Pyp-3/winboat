name: Custom WinBoat
on:
  push:
    branches: [multi-installations]
  pull_request:
    branches: [multi-installations]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: custom-build-${{ github.ref }}
  cancel-in-progress: true
jobs:
  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.14'
      - uses: actions/setup-go@v6
        with:
          go-version-file: guest_server/go.mod
          cache-dependency-path: guest_server/go.sum
      - name: Install native build dependencies
        run: sudo apt-get update && sudo apt-get install -y libudev-dev libusb-1.0-0-dev zip
      - name: Check, test and build
        run: make build package
      - name: Upload installable binary and checksum
        uses: actions/upload-artifact@v7
        with:
          name: winboat-linux-x86_64-${{ github.sha }}
          path: |
            dist/winboat-*.tar.gz
            dist/winboat-*.tar.gz.sha256
          if-no-files-found: error
          retention-days: 30
